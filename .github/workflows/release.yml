name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'weme-ui/weme-ui'
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      # v2 只认 *-script / commit-message / pr-title。
      # 有 changeset 时开 Version PR；合并后再走 publish-script 构建并发布。
      - name: Create Release Pull Request or Publish
        uses: changesets/action@v2.1.2
        with:
          version-script: bun run version-packages
          publish-script: bun run release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          create-github-releases: true
        env:
          NPM_CONFIG_PROVENANCE: true
