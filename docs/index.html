<!DOCTYPE html><html lang="zh-CN" class="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Weme UI</title><meta name="description" content="用 CLI 把组件源码装进仓库。组件在 slim。这个仓库是命令。"><link rel="icon" type="image/svg+xml" href="/weme-ui/weme.svg"><script>document.documentElement.classList.add('js')</script><link rel="stylesheet" href="/weme-ui/_astro/LandingLayout.C8cWmqif.css"></head><body><header class="site-nav"><a class="brand" href="/weme-ui/">WEME<span class="dot">.</span></a><nav class="nav-links" aria-label="页面"><a href="https://github.com/weme-ui/weme-ui" target="_blank" rel="noreferrer">GitHub</a><a href="https://weme-ui.github.io/slim" target="_blank" rel="noreferrer">slim</a><a href="/weme-ui/docs/unocss-preset/">Preset</a></nav></header><main class="landing"><h1 class="display" data-rise style="--i: 0">WEME<span class="dot">.</span></h1><p class="kicker" data-rise style="--i: 1">用 CLI 把组件源码装进仓库。</p><p class="statement" data-rise style="--i: 2">组件在 slim。这个仓库是命令。</p><div class="commands" data-rise style="--i: 3"><div class="command"><code>pnpm dlx @weme-ui/weme-ui init</code><button type="button" data-copy-command="pnpm dlx @weme-ui/weme-ui init" data-label-idle="复制" data-label-done="已复制">复制</button></div><div class="command"><code>pnpm dlx @weme-ui/weme-ui add weme-ui/slim/button</code><button type="button" data-copy-command="pnpm dlx @weme-ui/weme-ui add weme-ui/slim/button" data-label-idle="复制" data-label-done="已复制">复制</button></div></div></main><footer class="site-foot"><span>早期开发，请勿用于生产</span><span>MIT · 2026</span></footer><script type="module">function e(){document.querySelectorAll(`[data-copy-command]`).forEach(e=>{e.addEventListener(`click`,async()=>{let t=e.dataset.copyCommand;if(!t)return;let n=e.dataset.labelIdle||`复制`,r=e.dataset.labelDone||`已复制`;try{await navigator.clipboard.writeText(t),e.textContent=r,window.setTimeout(()=>{e.textContent=n},1600)}catch{e.textContent=`复制失败`,window.setTimeout(()=>{e.textContent=n},1600)}})})}e();</script></body></html>
