name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'weme-ui/weme-ui'
    permissions:
      id-token: write
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check tag
        run: bun scripts/release.ts --check

      # dist is gitignored. oxlint resolves workspace packages through their
      # package exports, which point at dist. turbo runs dependencies first.
      - name: Build workspace packages
        run: bunx turbo run build --filter=@weme-ui/schema --filter=@weme-ui/unocss-preset

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Publish
        run: bun run release
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: GitHub Release
        run: bunx changelogen gh release "${GITHUB_REF_NAME#v}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
